[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strujepa"
version = "0.1.0"
description = "Structure-aware elastic training with matrix-Transformer width completion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
wifo = [
  "hdf5storage>=0.1",
  "scipy>=1.10",
  "pyyaml>=6.0",
]
channel = [
  "pyyaml>=6.0",
]
traffic = [
  "pyyaml>=6.0",
]
dinov3 = [
  "pillow>=10",
  "tqdm>=4.66",
  "transformers>=4.45",
]
dev = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "timm>=1.0",
  "transformers>=4.45",
]

[tool.setuptools.packages.find]
include = ["elastic_method*", "integrations*"]
namespaces = true
